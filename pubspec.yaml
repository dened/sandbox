name: sandbox
description: "Sandbox for Flutter development"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2
  flutter: ^3.32.0
dependencies:
  cupertino_icons: ^1.0.0
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.1
  vector_graphics: ^1.1.19
  vector_graphics_codec: ^1.1.13
  path: 1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.8.0
  flutter_gen_runner: 5.12.0


# Linting
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
